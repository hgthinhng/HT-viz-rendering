<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" style="--accent:#2F7E7A">
  <title>Tàu container — bản test bảng màu editorial cream/navy/teal/gold</title>
  <desc>Bản dựng lại 01-container-ship.svg bằng bảng màu 4 tông cream/navy/teal/gold lấy từ bộ 97 motif Nano Banana Pro, để kiểm tra palette này có hoà với accent theo ngành hay không.</desc>
  <g class="scene">
    <rect x="0" y="0" width="800" height="500" fill="#F5EFE2"/>
    <g class="sea">
      <rect x="0" y="410" width="800" height="90" fill="#2F7E7A" opacity="0.55"/>
      <rect x="0" y="368" width="800" height="42" fill="#2F7E7A" opacity="0.28"/>
      <path d="M0 368 Q 30 360 60 368 T 120 368 T 180 368 T 240 368 T 300 368 T 360 368 T 420 368 T 480 368 T 540 368 T 600 368 T 660 368 T 720 368 T 780 368 T 800 368"
            fill="none" stroke="#2F7E7A" stroke-width="2" opacity="0.7"/>
    </g>

    <g class="hull">
      <path d="M150,300 L650,300 C667.5,300 692.5,255 700,255 L620,398 L150,398 Z" fill="#16283F" stroke="#16283F" stroke-width="1.5"/>
      <path d="M150,300 L650,300 C667.5,300 692.5,255 700,255 L652.4,340 L150,340 Z" fill="#2F4A63"/>
      <path d="M683,268 L633,378" stroke="#6B8299" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
      <path d="M150,368 L636.8,368 L620,398 L150,398 Z" fill="#2F7E7A" fill-opacity="0.22"/>
      <g class="portholes">
        <circle cx="163" cy="322" r="4" fill="none" stroke="#6B8299" stroke-width="1.4"/>
        <circle cx="163" cy="340" r="4" fill="none" stroke="#6B8299" stroke-width="1.4"/>
      </g>
      <g class="engine-hatch">
