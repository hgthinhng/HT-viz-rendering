    <g class="funnel">
      <path d="M215,90 Q205,108 215,124 T197,152" fill="none" stroke="#6B8299" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
      <rect x="200" y="150" width="30" height="62" fill="#16283F" stroke="#16283F" stroke-width="1.2"/>
      <rect x="200" y="150" width="30" height="16" fill="var(--accent)"/>
    </g>

    <g class="mast">
      <line x1="170" y1="210" x2="170" y2="175" stroke="#16283F" stroke-width="2"/>
      <path d="M170,175 L200,182 L170,189 Z" fill="var(--accent)"/>
    </g>
