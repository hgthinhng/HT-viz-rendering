      </g>
      <g class="draft-marks" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="8" fill="#F5EFE2">
        <line x1="585" y1="345" x2="600" y2="345" stroke="#F5EFE2" stroke-width="1.6"/>
        <text x="604" y="348">16M</text>
        <line x1="585" y1="357" x2="600" y2="357" stroke="#F5EFE2" stroke-width="1.6"/>
        <text x="604" y="360">14M</text>
        <line x1="585" y1="369" x2="600" y2="369" stroke="#F5EFE2" stroke-width="1.6"/>
        <text x="604" y="372">12M</text>
        <line x1="585" y1="381" x2="600" y2="381" stroke="#F5EFE2" stroke-width="1.6"/>
        <text x="604" y="384">10M</text>
        <line x1="585" y1="393" x2="600" y2="393" stroke="#F5EFE2" stroke-width="1.6"/>
        <text x="604" y="396">8M</text>
      </g>
    </g>

    <g class="containers" stroke="#F5EFE2" stroke-width="1.2">
      <rect x="290" y="263" width="50" height="34" fill="#2F7E7A"/>
      <rect x="290" y="226" width="50" height="34" fill="#C9A227"/>

      <rect x="348" y="263" width="50" height="34" fill="#C9A227"/>
      <rect x="348" y="226" width="50" height="34" fill="#6B8299"/>
      <rect x="348" y="189" width="50" height="34" fill="#2F7E7A"/>

      <rect x="406" y="263" width="50" height="34" fill="#16283F"/>

      <rect x="464" y="263" width="50" height="34" fill="#6B8299"/>
      <rect x="464" y="226" width="50" height="34" fill="#C9A227"/>
      <rect x="464" y="189" width="50" height="34" fill="#2F7E7A"/>

      <rect x="522" y="263" width="50" height="34" fill="#16283F"/>
      <rect x="522" y="226" width="50" height="34" fill="#6B8299"/>

      <rect x="580" y="263" width="50" height="34" fill="#C9A227"/>
    </g>

    <g class="bridge">
      <rect x="165" y="210" width="95" height="90" fill="#F5EFE2" stroke="#16283F" stroke-width="1.5"/>
      <rect x="170" y="228" width="85" height="8" fill="#16283F"/>
      <rect x="170" y="250" width="85" height="8" fill="#16283F"/>
      <g class="windows" fill="#16283F">
