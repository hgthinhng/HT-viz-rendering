<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" style="--accent:#2563eb">
  <title>Tàu container</title>
  <desc>Tàu chở container nhìn ngang, mũi tàu (phải) hướng ra khơi, đuôi tàu (trái) có cabin chỉ huy và ống khói. Dùng minh hoạ ngành vận tải biển và logistics cảng.</desc>
  <g class="scene">
    <g class="sea">
      <rect x="0" y="410" width="800" height="90" fill="#93c5fd"/>
      <rect x="0" y="368" width="800" height="42" fill="#bfdbfe"/>
      <path d="M0 368 Q 30 360 60 368 T 120 368 T 180 368 T 240 368 T 300 368 T 360 368 T 420 368 T 480 368 T 540 368 T 600 368 T 660 368 T 720 368 T 780 368 T 800 368"
            fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
    </g>

    <g class="hull">
      <path d="M150,300 L650,300 C667.5,300 692.5,255 700,255 L620,398 L150,398 Z" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
      <!-- dải sáng 2-tone PHẢI đi theo đúng đường viền mũi tàu (kể cả đoạn
           bo cong lên mũi), không phải 1 rect cắt cụt ở x=650 — bản trước
           dừng rect đúng chỗ mũi bắt đầu, tạo đường ranh dọc giả khiến mũi
           trông như 1 miếng vá tối màu rời khỏi thân thay vì liền khối. -->
      <path d="M150,300 L650,300 C667.5,300 692.5,255 700,255 L652.4,340 L150,340 Z" fill="#475569"/>
      <!-- gờ sáng dọc mép mũi — phản hồi: mũi liền khối rồi nhưng vẫn tối
           đặc/nặng so với phần thân có dải sáng. Thêm 1 nét mảnh màu sáng
           hơn nền tối, chạy song song mép vát mũi, gợi ánh sáng bắt vào
           cạnh vát — chỉ trang trí, không đổi khối/silhouette. -->
      <path d="M683,268 L633,378" stroke="#64748b" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
      <path d="M150,368 L636.8,368 L620,398 L150,398 Z" fill="#1d4ed8" fill-opacity="0.16"/>
      <g class="portholes">
        <circle cx="163" cy="322" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
        <circle cx="163" cy="340" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      </g>
      <g class="engine-hatch">
        <rect x="470" y="355" width="60" height="34" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 3"/>
      </g>
      <g class="draft-marks" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="8" fill="#e2e8f0">
        <line x1="585" y1="345" x2="600" y2="345" stroke="#e2e8f0" stroke-width="1.6"/>
        <text x="604" y="348">16M</text>
        <line x1="585" y1="357" x2="600" y2="357" stroke="#e2e8f0" stroke-width="1.6"/>
        <text x="604" y="360">14M</text>
        <line x1="585" y1="369" x2="600" y2="369" stroke="#e2e8f0" stroke-width="1.6"/>
        <text x="604" y="372">12M</text>
        <line x1="585" y1="381" x2="600" y2="381" stroke="#e2e8f0" stroke-width="1.6"/>
        <text x="604" y="384">10M</text>
        <line x1="585" y1="393" x2="600" y2="393" stroke="#e2e8f0" stroke-width="1.6"/>
        <text x="604" y="396">8M</text>
      </g>
    </g>

    <g class="containers" stroke="#f8fafc" stroke-width="1.2">
      <rect x="290" y="263" width="50" height="34" fill="#2563eb"/>
      <rect x="290" y="226" width="50" height="34" fill="#0d9488"/>

      <rect x="348" y="263" width="50" height="34" fill="#f59e0b"/>
      <rect x="348" y="226" width="50" height="34" fill="#64748b"/>
      <rect x="348" y="189" width="50" height="34" fill="#2563eb"/>

      <rect x="406" y="263" width="50" height="34" fill="#0d9488"/>

      <rect x="464" y="263" width="50" height="34" fill="#64748b"/>
      <rect x="464" y="226" width="50" height="34" fill="#f59e0b"/>
      <rect x="464" y="189" width="50" height="34" fill="#0d9488"/>

      <rect x="522" y="263" width="50" height="34" fill="#2563eb"/>
      <rect x="522" y="226" width="50" height="34" fill="#64748b"/>

      <rect x="580" y="263" width="50" height="34" fill="#f59e0b"/>
    </g>

    <g class="bridge">
      <rect x="165" y="210" width="95" height="90" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
      <rect x="170" y="228" width="85" height="8" fill="#0f172a"/>
      <rect x="170" y="250" width="85" height="8" fill="#0f172a"/>
      <g class="windows" fill="#0f172a">
        <rect x="175" y="270" width="14" height="14"/>
        <rect x="200" y="270" width="14" height="14"/>
        <rect x="225" y="270" width="14" height="14"/>
        <rect x="250" y="270" width="10" height="14"/>
      </g>
    </g>

    <g class="funnel">
      <path d="M215,90 Q205,108 215,124 T197,152" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
      <rect x="200" y="150" width="30" height="62" fill="#1e293b" stroke="#0f172a" stroke-width="1.2"/>
      <rect x="200" y="150" width="30" height="16" fill="var(--accent)"/>
    </g>

    <g class="mast">
      <line x1="170" y1="210" x2="170" y2="175" stroke="#0f172a" stroke-width="2"/>
      <path d="M170,175 L200,182 L170,189 Z" fill="var(--accent)"/>
    </g>
  </g>
</svg>
