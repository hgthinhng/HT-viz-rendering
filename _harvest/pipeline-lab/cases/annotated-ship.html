<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><style>
@font-face { font-family:'Be Vietnam Pro'; src:url('file:///home/hgthinhng/.fonts/BeVietnamPro-Regular.ttf'); font-weight:400; }
@font-face { font-family:'Be Vietnam Pro'; src:url('file:///home/hgthinhng/.fonts/BeVietnamPro-SemiBold.ttf'); font-weight:600; }
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1013px;background:#f8fafc;padding:40px;font-family:'Be Vietnam Pro',sans-serif;}
h2{font-size:20px;font-weight:600;color:#0f172a;margin-bottom:20px;}
</style></head><body>
<h2>Minh hoạ kỹ thuật: cấu trúc tàu container và điểm rủi ro vận hành</h2>
<svg width="930" height="480" viewBox="0 0 930 480">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4">
      <circle cx="4" cy="4" r="3.5" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- sea -->
  <rect x="0" y="360" width="930" height="120" fill="url(#sea)"/>
  <path d="M0 360 Q 40 350 80 360 T 160 360 T 240 360 T 320 360 T 400 360 T 480 360 T 560 360 T 640 360 T 720 360 T 800 360 T 880 360 T 930 360"
        fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>

  <!-- hull -->
  <path d="M120 300 L780 300 L740 360 L160 360 Z" fill="url(#hull)" stroke="#0f172a" stroke-width="2"/>
  <!-- deck / cargo bay -->
  <rect x="180" y="220" width="500" height="80" fill="#334155" stroke="#0f172a" stroke-width="1.5"/>
  <!-- container stacks (color-coded rows) -->
  <g stroke="#0f172a" stroke-width="1">
    <rect x="210" y="150" width="60" height="70" fill="#2563eb"/>
    <rect x="280" y="150" width="60" height="70" fill="#dc2626"/>
    <rect x="350" y="150" width="60" height="70" fill="#16a34a"/>
    <rect x="420" y="150" width="60" height="70" fill="#2563eb"/>
    <rect x="490" y="150" width="60" height="70" fill="#eab308"/>
    <rect x="560" y="150" width="60" height="70" fill="#dc2626"/>
  </g>
  <!-- bridge / superstructure -->
  <rect x="640" y="120" width="90" height="100" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="655" y="140" width="18" height="16" fill="#0f172a"/>
  <rect x="685" y="140" width="18" height="16" fill="#0f172a"/>
  <!-- funnel -->
  <rect x="700" y="70" width="26" height="55" fill="#1e293b" stroke="#0f172a"/>
  <rect x="700" y="70" width="26" height="14" fill="#dc2626"/>

  <!-- ==== ANNOTATION LAYER: leader lines + callout labels ==== -->
  <g font-family="Be Vietnam Pro" font-size="13.5" fill="#0f172a">
    <!-- Callout 1: container stack -> risk label above -->
    <circle cx="310" cy="150" r="3.5" fill="#0f172a"/>
    <path d="M310 150 C 300 90, 260 70, 200 62" fill="none" stroke="#0f172a" stroke-width="1.2" marker-end="url(#dot)"/>
    <rect x="40" y="30" width="230" height="46" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
    <text x="52" y="48" font-weight="600" fill="#9a3412">Rủi ro #1: giá cước container</text>
    <text x="52" y="65" fill="#7c2d12">Biến động cước ảnh hưởng trực tiếp doanh thu/TEU</text>

    <!-- Callout 2: hull waterline -> draft / capacity -->
    <circle cx="450" cy="330" r="3.5" fill="#0f172a"/>
    <path d="M450 330 C 460 400, 560 430, 650 438" fill="none" stroke="#0f172a" stroke-width="1.2" marker-end="url(#dot)"/>
    <rect x="640" y="410" width="260" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="652" y="428" font-weight="600" fill="#1e3a8a">Mớn nước / tải trọng</text>
    <text x="652" y="445" fill="#1e40af">Giới hạn công suất chở hàng theo tuyến</text>

    <!-- Callout 3: bridge -> operating cost / crew -->
    <circle cx="685" cy="150" r="3.5" fill="#0f172a"/>
    <path d="M685 150 C 760 130, 830 110, 870 90" fill="none" stroke="#0f172a" stroke-width="1.2" marker-end="url(#dot)"/>
    <rect x="700" y="55" width="200" height="46" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
    <text x="712" y="73" font-weight="600" fill="#14532d">Vận hành / thuỷ thủ đoàn</text>
    <text x="712" y="90" fill="#166534">Chi phí nhân sự và bảo trì</text>
  </g>

  <text x="120" y="475" font-family="Be Vietnam Pro" font-size="12" fill="#475569">Sơ đồ minh hoạ do LLM tự vẽ bằng SVG nguyên thuỷ (rect/path/circle), không dùng thư viện icon ngoài.</text>
</svg>
</body></html>
