<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1013px;background:#0b1220;padding:40px;position:relative;}
.stripe{position:absolute;top:0;left:0;width:100%;height:100%;
  background:repeating-linear-gradient(45deg,#ef4444 0 20px,#3b82f6 20px 40px,#22c55e 40px 60px,#eab308 60px 80px);}
.card{position:relative;height:200px;border-radius:12px;padding:20px;color:#fff;font-family:sans-serif;
  background:rgba(255,255,255,0.08);backdrop-filter:blur(12px);border:1px solid #475569;}
</style></head><body>
<div class="stripe"></div>
<div class="card">Case4b backdrop-blur trên nền sọc màu (test thật)</div>
</body></html>
