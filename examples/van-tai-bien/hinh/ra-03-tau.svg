    <g class="mast">
      <line x1="170" y1="210" x2="170" y2="175" stroke="#0f172a" stroke-width="2"/>
      <path d="M170,175 L200,182 L170,189 Z" fill="rgb(37, 99, 235)"/>
    </g>
  </g>
<g class="annotations"><g class="callout" cursor="default"><circle cx="345" cy="120" r="3.2" fill="rgb(37, 99, 235)"/><circle cx="345" cy="120" r="6" fill="none" stroke="rgb(37, 99, 235)" stroke-width="1" stroke-opacity="0.4"/><path class="anno-leader" d="M 345 120 L 345 80 Q 345 70 335 70 L 249.92000000000002 70" fill="none" stroke="rgb(37, 99, 235)" stroke-width="1.3" stroke-opacity="0.85"/><rect class="anno-box" x="30" y="42" width="219.92000000000002" height="56" rx="5" fill="color(srgb 0.922902 0.944863 0.984235)" stroke="rgb(37, 99, 235)" stroke-width="1.1"/><rect class="anno-bar" x="246.92000000000002" y="42" width="3" height="56" fill="rgb(37, 99, 235)"/><text x="40" y="58" font-family="'IBM Plex Sans', 'Noto Sans', sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">38% chi phí vận hành</text><text x="40" y="72" font-family="'IBM Plex Sans', 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">Nhiên liệu đốt, khoản chi lớn nhất</text><text x="40" y="86" font-family="'IBM Plex Sans', 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">của một chuyến</text></g><g class="callout" cursor="default"><circle cx="470" cy="210" r="3.2" fill="#334155"/><circle cx="470" cy="210" r="6" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.4"/><path class="anno-leader" d="M 470 210 L 470 150 Q 470 140 460 140 L 238.16000000000003 140" fill="none" stroke="#334155" stroke-width="1.3" stroke-opacity="0.85"/><rect class="anno-box" x="30" y="112" width="208.16000000000003" height="56" rx="5" fill="#f8fafc" stroke="#334155" stroke-width="1.1"/><rect class="anno-bar" x="235.16000000000003" y="112" width="3" height="56" fill="#334155"/><text x="40" y="128" font-family="'IBM Plex Sans', 'Noto Sans', sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">2.185 điểm</text><text x="40" y="142" font-family="'IBM Plex Sans', 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">Cước tuyến Á Âu quý II/2026, gấp</text><text x="40" y="156" font-family="'IBM Plex Sans', 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">1,85 lần đáy chu kỳ</text></g><g class="callout" cursor="default"><circle cx="342" cy="280" r="3.2" fill="#334155"/><circle cx="342" cy="280" r="6" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.4"/><path class="anno-leader" d="M 342 280 L 342 414 Q 342 424 332 424 L 238.16000000000003 424" fill="none" stroke="#334155" stroke-width="1.3" stroke-opacity="0.85"/><rect class="anno-box" x="30" y="396" width="208.16000000000003" height="56" rx="5" fill="#f8fafc" stroke="#334155" stroke-width="1.1"/><rect class="anno-bar" x="235.16000000000003" y="396" width="3" height="56" fill="#334155"/><text x="40" y="412" font-family="'IBM Plex Sans', 'Noto Sans', sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">22 người mỗi tàu</text><text x="40" y="426" font-family="'IBM Plex Sans', 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">Chi phí thuỷ thủ đoàn gần như cố</text><text x="40" y="440" font-family="'IBM Plex Sans', 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">định theo chuyến</text></g><g class="callout" cursor="default"><circle cx="725" cy="375" r="3.2" fill="#334155"/><circle cx="725" cy="375" r="6" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.4"/><path class="anno-leader" d="M 725 375 L 725 89 Q 725 79 735 79 L 867.72 79" fill="none" stroke="#334155" stroke-width="1.3" stroke-opacity="0.85"/><rect class="anno-box" x="867.72" y="51" width="202.28000000000003" height="56" rx="5" fill="#f8fafc" stroke="#334155" stroke-width="1.1"/><rect class="anno-bar" x="867.72" y="51" width="3" height="56" fill="#334155"/><text x="877.72" y="67" font-family="'IBM Plex Sans', 'Noto Sans', sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Mớn nước 14 mét</text><text x="877.72" y="81" font-family="'IBM Plex Sans', 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">Chỉ ba cụm cảng trong nước nhận</text><text x="877.72" y="95" font-family="'IBM Plex Sans', 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">được tàu cỡ này</text></g><g class="callout" cursor="default"><circle cx="630" cy="382" r="3.2" fill="#dc2626"/><circle cx="630" cy="382" r="6" fill="none" stroke="#dc2626" stroke-width="1" stroke-opacity="0.4"/><path class="anno-leader" d="M 630 382 L 630 414 Q 630 424 640 424 L 867.72 424" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-opacity="0.85"/><rect class="anno-box" x="867.72" y="396" width="202.28000000000003" height="56" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.1"/><rect class="anno-bar" x="867.72" y="396" width="3" height="56" fill="#dc2626"/><text x="877.72" y="412" font-family="'IBM Plex Sans', 'Noto Sans', sans-serif" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="start">14,2 năm tuổi tàu</text><text x="877.72" y="426" font-family="'IBM Plex Sans', 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">Chi phí bảo trì khoang máy tăng</text><text x="877.72" y="440" font-family="'IBM Plex Sans', 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">theo tuổi, không tuyến tính</text></g></g></svg>