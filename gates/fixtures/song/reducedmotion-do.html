<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<title>Fixture do: REDUCED-MOTION</title>
<style>
@keyframes nhap-nhay { from { opacity: 0.2; } to { opacity: 1; } }
.dot { display: inline-block; width: 12px; height: 12px; background: #16A34A; animation: nhap-nhay 2s infinite; }
/* KHONG co @media (prefers-reduced-motion: reduce) nao ca: animation chay mai. */
</style>
</head>
<body>
<p>Chi so dang cap nhat</p>
<span class="dot"></span>
</body>
</html>
