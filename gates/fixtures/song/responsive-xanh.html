<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<title>Fixture xanh: RESPONSIVE-WIDTH</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; }
.khung { width: 100%; max-width: 900px; margin: 0 auto; }
.bang { width: 100%; overflow-x: auto; display: block; }
table { width: 100%; border-collapse: collapse; }
</style>
</head>
<body>
<div class="khung">
<h1>Bao cao chi tieu</h1>
<div class="bang">
<table>
<tr><th>Quy</th><th>Doanh thu</th><th>Loi nhuan</th></tr>
<tr><td>Q1</td><td>1.100 ty</td><td>250 ty</td></tr>
<tr><td>Q2</td><td>1.180 ty</td><td>280 ty</td></tr>
</table>
</div>
</div>
</body>
</html>
