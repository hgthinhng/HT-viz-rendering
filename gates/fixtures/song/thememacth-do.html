<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Fixture do: THEME-MATCH</title>
<style>
body { background: #0A1420; color: #FFFFFF; padding: 24px; }
.hinh-khung { background: #0A1420; padding: 8px; margin-bottom: 16px; }
</style>
</head>
<body>
<!-- Hinh 1: KHONG khai data-theme, benh cu cua repo (sinh o chu de khac roi
     nhung thang vao trang). Thieu tinh la FAIL chu khong SKIP. -->
<div class="hinh-khung">
<svg id="hinh-1" width="200" height="120" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="200" height="120" fill="#FFFFFF"></rect>
<text x="10" y="60" fill="#0A1420">Bieu do sinh o chu de sang, khong khai lai</text>
</svg>
</div>
<!-- Hinh 2: co khai data-theme khop, nhung nen SVG gan nhu trung nen trang:
     lop thuc nghiem phai bat duoc rieng ca nay, doc lap voi lop khai bao. -->
<div class="hinh-khung">
<svg id="hinh-2" data-theme="dark" width="200" height="120" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="200" height="120" fill="#0B1522"></rect>
<text x="10" y="60" fill="#0F1B28">Bieu do khong con phan biet duoc voi nen trang</text>
</svg>
</div>
</body>
</html>
