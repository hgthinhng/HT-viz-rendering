<svg viewBox="0 0 400 700" xmlns="http://www.w3.org/2000/svg" role="img" style="--accent:#0891b2">
  <title>Bản đồ Việt Nam (đường biên giới thật, đơn giản hoá bằng thuật toán)</title>
  <desc>Đường bờ biển Việt Nam lấy từ dữ liệu địa lý thật (Natural Earth qua world-atlas), đơn giản hoá bằng d3-geo/topojson-simplify (Visvalingam's area, còn 72 điểm), KHÔNG tay-gõ toạ độ. Đánh dấu ba đô thị lớn và một vùng tô đậm ví dụ ở đồng bằng sông Cửu Long. Dùng minh hoạ phân bổ thị trường theo vùng địa lý.</desc>
  <!--
    NGUỒN GỐC PATH: sinh bởi gen-vietnam-path.mjs cùng thư mục cha, KHÔNG
    tay-gõ. Quy trình: world-atlas (countries-50m.json, id=704 Việt Nam) ->
    topojson-simplify (Visvalingam's area, minWeight=0.05, 613 điểm gốc còn
    72 điểm sau khi giữ lục địa chính, bỏ các đảo rời rạc để đọc gọn 1 khối)
    -> topojson-client.feature -> d3-geo.geoMercator().fitExtent([[24,24],
    [376,676]], geom) -> d3-geo.geoPath(). Đã thử 3 mức đơn giản hoá
    (118/72/50 điểm, xem demo/vietnam-compare.html + png tương ứng) và chọn
    72 điểm, đủ giữ đặc trưng (eo mảnh, ngón tay đồng bằng sông Cửu Long,
    biên giới Tây Bắc lởm chởm), không quá dày cho 1 icon minh hoạ. Muốn
    tái tạo hoặc đổi độ chi tiết: `SIMPLIFY_WEIGHT=0.05 node
    gen-vietnam-path.mjs` (số càng nhỏ càng chi tiết).
  -->
  <defs>
    <clipPath id="vn-south-clip">
      <rect x="0" y="520" width="400" height="180"/>
    </clipPath>
  </defs>
  <g class="scene">
    <path class="coastline"
      d="M292.66,108.189L268.713,118.379L258.341,133.596L237.903,131.233L231.039,163.459L208.313,179.281L193.06,222.964L204.347,243.7L230.124,268.557L229.361,278.602L259.104,315.119L294.948,340.141L328.503,382.118L348.942,448.782L347.569,473.902L355.043,503.485L345.434,501.45L344.519,541.331L335.52,558.146L262.46,598.664L228.751,602.926L242.326,610.773L225.091,634.885L187.874,654.711L171.554,674.661L156.911,676L160.114,632.721L170.639,620.034L142.421,598.066L160.267,592.755L167.588,577.56L198.704,573.14L215.939,581.529L202.974,559.946L209.228,539.904L226.463,542.533L226.616,531.712L268.103,518.172L274.967,506.047L277.102,467.023L265.358,436.957L273.441,411.668L279.085,387.532L259.409,361.881L268.256,352.855L240.343,334.774L230.276,312.582L154.623,230.271L119.847,206.223L125.643,191.164L147.455,194.053L163.622,175.681L148.98,147.286L126.559,133.911L108.866,145.006L86.292,136.195L75.615,119.168L79.733,100.278L69.056,101.149L44.957,68.381L57.617,52.134L82.173,65.04L94.681,50.699L120.61,61.139L157.979,43.995L178.265,24L202.364,43.436L242.021,50.06L231.802,67.666L237.14,86.729L266.273,103.602Z"
      fill="var(--ilus-8, #e2e8f0)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.6"/>

    <path class="mekong-delta-highlight" clip-path="url(#vn-south-clip)"
      d="M292.66,108.189L268.713,118.379L258.341,133.596L237.903,131.233L231.039,163.459L208.313,179.281L193.06,222.964L204.347,243.7L230.124,268.557L229.361,278.602L259.104,315.119L294.948,340.141L328.503,382.118L348.942,448.782L347.569,473.902L355.043,503.485L345.434,501.45L344.519,541.331L335.52,558.146L262.46,598.664L228.751,602.926L242.326,610.773L225.091,634.885L187.874,654.711L171.554,674.661L156.911,676L160.114,632.721L170.639,620.034L142.421,598.066L160.267,592.755L167.588,577.56L198.704,573.14L215.939,581.529L202.974,559.946L209.228,539.904L226.463,542.533L226.616,531.712L268.103,518.172L274.967,506.047L277.102,467.023L265.358,436.957L273.441,411.668L279.085,387.532L259.409,361.881L268.256,352.855L240.343,334.774L230.276,312.582L154.623,230.271L119.847,206.223L125.643,191.164L147.455,194.053L163.622,175.681L148.98,147.286L126.559,133.911L108.866,145.006L86.292,136.195L75.615,119.168L79.733,100.278L69.056,101.149L44.957,68.381L57.617,52.134L82.173,65.04L94.681,50.699L120.61,61.139L157.979,43.995L178.265,24L202.364,43.436L242.021,50.06L231.802,67.666L237.14,86.729L266.273,103.602Z"
      fill="var(--accent)" opacity="0.24" stroke="none"/>

    <!-- text city label dùng paint-order="stroke" + stroke trắng làm HALO
         mỏng quanh chữ, sửa lỗi thật: chữ "Hà Nội" bị đường biên coastline
         cắt ngang (chữ và path outline cùng màu tối #0f172a, không có gì
         phân tách). Halo trắng rộng 4px đủ để chữ luôn đọc được dù đè lên
         đường biên hay vùng tô đậm phía dưới. Áp NHẤT QUÁN cho cả 3 nhãn.
         Giới hạn: halo trắng cứng giả định nền trang là trắng/kem, nếu
         nhúng vào nền tối phải đổi màu stroke tương ứng. -->
    <g class="cities" font-family="'Be Vietnam Pro',sans-serif" font-size="14" font-weight="600">
      <g class="city">
        <circle cx="202.0" cy="130.0" r="6" fill="var(--accent)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.2"/>
        <text x="214" y="134" fill="var(--ilus-1, #0f172a)" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Hà Nội</text>
      </g>
      <g class="city">
        <circle cx="303.1" cy="352.4" r="6" fill="var(--accent)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.2"/>
        <text x="315" y="356" fill="var(--ilus-1, #0f172a)" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Đà Nẵng</text>
      </g>
      <g class="city">
        <circle cx="235.7" cy="580.3" r="6" fill="var(--accent)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.2"/>
        <text x="247" y="584" fill="var(--ilus-1, #0f172a)" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">TP.HCM</text>
      </g>
    </g>

    <g class="compass" transform="translate(345,60)" opacity="0.6">
      <line x1="0" y1="14" x2="0" y2="-14" stroke="var(--ilus-1, #0f172a)" stroke-width="1.4"/>
      <path d="M0,-14 L5,-4 L0,-7 L-5,-4 Z" fill="var(--ilus-1, #0f172a)"/>
      <text x="0" y="28" font-family="'IBM Plex Mono',monospace" font-size="10" fill="var(--ilus-4, #475569)" text-anchor="middle">B</text>
    </g>
  </g>
</svg>
