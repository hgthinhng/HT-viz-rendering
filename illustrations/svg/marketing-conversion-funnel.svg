<svg viewBox="0 0 600 560" xmlns="http://www.w3.org/2000/svg" role="img" style="--accent:#7c3aed">
  <title>Phễu chuyển đổi</title>
  <desc>Phễu vật lý bốn tầng thu hẹp dần, hạt đầu vào rơi từ trên xuống, một phần rò rỉ ra ngoài ở mỗi tầng, phần còn lại ra khỏi vòi hẹp phía dưới. Dùng minh hoạ kênh chuyển đổi khách hàng. Độ thu hẹp mỗi tầng ánh xạ tỷ lệ rơi rụng thật.</desc>
  <g class="scene">
    <g class="ground">
      <rect x="0" y="520" width="600" height="40" fill="var(--ilus-7, #cbd5e1)"/>
    </g>

    <g class="input-particles" fill="var(--accent)" opacity="0.8">
      <circle cx="120" cy="30" r="6"/>
      <circle cx="170" cy="18" r="6"/>
      <circle cx="230" cy="34" r="6"/>
      <circle cx="290" cy="16" r="6"/>
      <circle cx="350" cy="32" r="6"/>
      <circle cx="410" cy="20" r="6"/>
      <circle cx="460" cy="34" r="6"/>
      <circle cx="330" cy="42" r="6"/>
    </g>

    <g class="funnel" stroke="var(--ilus-1, #0f172a)" stroke-width="1.5">
      <path d="M80,60 L520,60 L472.5,150 L127.5,150 Z" fill="#ddd6fe"/>
      <path d="M127.5,150 L472.5,150 L425,240 L175,240 Z" fill="#c4b5fd"/>
      <path d="M175,240 L425,240 L377.5,330 L222.5,330 Z" fill="#a78bfa"/>
      <path d="M222.5,330 L377.5,330 L330,420 L270,420 Z" fill="var(--accent)"/>
      <rect x="270" y="420" width="60" height="40" fill="var(--accent)"/>
      <line x1="80" y1="60" x2="127.5" y2="150" stroke-width="1.8" opacity="0"/>
    </g>

    <g class="leaks" fill="none" stroke="#f87171" stroke-width="2">
      <path d="M472.5,150 L500,158" marker-end="url(#leakArrow)"/>
      <path d="M425,240 L452,250" marker-end="url(#leakArrow)"/>
      <path d="M377.5,330 L402,342" marker-end="url(#leakArrow)"/>
    </g>
    <defs>
      <marker id="leakArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 Z" fill="#f87171"/>
      </marker>
    </defs>

    <g class="output-tray">
      <path d="M245,460 L355,460 L345,486 L255,486 Z" fill="var(--ilus-6, #94a3b8)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.4"/>
      <rect x="270" y="486" width="10" height="30" fill="var(--ilus-5, #64748b)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.2"/>
      <rect x="320" y="486" width="10" height="30" fill="var(--ilus-5, #64748b)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.2"/>
      <circle cx="300" cy="472" r="5" fill="var(--accent)"/>
    </g>
  </g>
</svg>
