<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" style="--accent:#0ea5e9">
  <title>Giàn khoan dầu khí ngoài khơi</title>
  <desc>Giàn khoan trên 4 chân giàn giáo đứng trên mặt biển, tháp khoan (derrick) ở giữa boong, cần đuốc đốt khí đồng hành ở cạnh phải, sân đỗ trực thăng và cần cẩu nhỏ. Dùng minh hoạ ngành dầu khí thượng nguồn.</desc>
  <g class="scene">
    <g class="sea">
      <rect x="0" y="430" width="800" height="70" fill="#93c5fd"/>
      <rect x="0" y="380" width="800" height="50" fill="#bfdbfe"/>
      <path d="M0 380 Q 30 372 60 380 T 120 380 T 180 380 T 240 380 T 300 380 T 360 380 T 420 380 T 480 380 T 540 380 T 600 380 T 660 380 T 720 380 T 780 380 T 800 380"
            fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
    </g>

    <g class="legs" stroke="var(--ilus-1, #0f172a)" stroke-width="1.2">
      <g class="leg" fill="none">
        <line x1="223" y1="285" x2="200" y2="460" stroke="var(--ilus-5, #64748b)" stroke-width="5"/>
        <line x1="237" y1="285" x2="212" y2="460" stroke="var(--ilus-6, #94a3b8)" stroke-width="5"/>
        <line x1="205" y1="340" x2="233" y2="340" stroke="var(--ilus-1, #0f172a)" stroke-width="2"/>
        <line x1="203" y1="400" x2="228" y2="400" stroke="var(--ilus-1, #0f172a)" stroke-width="2"/>
      </g>
      <g class="leg" fill="none">
        <line x1="333" y1="285" x2="318" y2="460" stroke="var(--ilus-5, #64748b)" stroke-width="5"/>
        <line x1="347" y1="285" x2="330" y2="460" stroke="var(--ilus-6, #94a3b8)" stroke-width="5"/>
        <line x1="322" y1="340" x2="342" y2="340" stroke="var(--ilus-1, #0f172a)" stroke-width="2"/>
        <line x1="320" y1="400" x2="337" y2="400" stroke="var(--ilus-1, #0f172a)" stroke-width="2"/>
      </g>
      <g class="leg" fill="none">
        <line x1="453" y1="285" x2="468" y2="460" stroke="var(--ilus-5, #64748b)" stroke-width="5"/>
        <line x1="467" y1="285" x2="480" y2="460" stroke="var(--ilus-6, #94a3b8)" stroke-width="5"/>
        <line x1="458" y1="340" x2="478" y2="340" stroke="var(--ilus-1, #0f172a)" stroke-width="2"/>
        <line x1="463" y1="400" x2="483" y2="400" stroke="var(--ilus-1, #0f172a)" stroke-width="2"/>
      </g>
      <g class="leg" fill="none">
        <line x1="563" y1="285" x2="588" y2="460" stroke="var(--ilus-5, #64748b)" stroke-width="5"/>
        <line x1="577" y1="285" x2="600" y2="460" stroke="var(--ilus-6, #94a3b8)" stroke-width="5"/>
        <line x1="568" y1="340" x2="592" y2="340" stroke="var(--ilus-1, #0f172a)" stroke-width="2"/>
        <line x1="573" y1="400" x2="596" y2="400" stroke="var(--ilus-1, #0f172a)" stroke-width="2"/>
      </g>
    </g>

    <g class="deck">
      <rect x="180" y="250" width="420" height="35" fill="var(--ilus-3, #334155)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.5"/>
      <rect x="180" y="250" width="420" height="12" fill="var(--ilus-5, #64748b)"/>
    </g>

    <g class="derrick">
      <path d="M345,250 L370,90 L390,90 L415,250 Z" fill="var(--ilus-6, #94a3b8)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.4"/>
      <line x1="349" y1="230" x2="411" y2="230" stroke="var(--ilus-1, #0f172a)" stroke-width="1.6"/>
      <line x1="354" y1="205" x2="406" y2="205" stroke="var(--ilus-1, #0f172a)" stroke-width="1.6"/>
      <line x1="358" y1="180" x2="402" y2="180" stroke="var(--ilus-1, #0f172a)" stroke-width="1.6"/>
      <line x1="363" y1="155" x2="397" y2="155" stroke="var(--ilus-1, #0f172a)" stroke-width="1.6"/>
      <line x1="367" y1="130" x2="393" y2="130" stroke="var(--ilus-1, #0f172a)" stroke-width="1.6"/>
      <line x1="345" y1="250" x2="390" y2="205" stroke="var(--ilus-1, #0f172a)" stroke-width="1.2"/>
      <line x1="415" y1="250" x2="370" y2="205" stroke="var(--ilus-1, #0f172a)" stroke-width="1.2"/>
      <rect x="360" y="80" width="40" height="12" fill="var(--accent)"/>
    </g>

    <g class="tanks">
      <rect x="440" y="212" width="24" height="38" fill="var(--ilus-6, #94a3b8)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.2"/>
      <rect x="464" y="212" width="12" height="38" fill="var(--ilus-5, #64748b)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.2"/>
      <path d="M440,212 A18,9 0 0 1 476,212 Z" fill="var(--ilus-6, #94a3b8)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.2"/>
    </g>

    <g class="helipad">
      <circle cx="230" cy="236" r="20" fill="var(--ilus-8, #e2e8f0)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.4"/>
      <circle cx="230" cy="236" r="15" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <text x="230" y="242" font-family="'Be Vietnam Pro',sans-serif" font-weight="700" font-size="16" fill="var(--ilus-1, #0f172a)" text-anchor="middle">H</text>
    </g>

    <g class="crane">
      <line x1="558" y1="250" x2="558" y2="205" stroke="var(--ilus-1, #0f172a)" stroke-width="3"/>
      <line x1="558" y1="208" x2="510" y2="222" stroke="var(--ilus-1, #0f172a)" stroke-width="3"/>
      <line x1="512" y1="222" x2="512" y2="250" stroke="var(--ilus-3, #334155)" stroke-width="1.2" stroke-dasharray="3 3"/>
    </g>

    <g class="flare">
      <line x1="600" y1="260" x2="700" y2="175" stroke="var(--ilus-4, #475569)" stroke-width="4"/>
      <path d="M700,175 C692,160 706,150 700,135 C716,148 722,168 706,180 C704,176 702,176 700,175 Z" fill="#ea580c"/>
      <path d="M700,168 C696,158 704,152 700,143 C709,152 712,164 702,171 Z" fill="#fbbf24"/>
    </g>
  </g>
</svg>
