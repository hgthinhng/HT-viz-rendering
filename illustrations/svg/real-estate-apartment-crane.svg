<svg viewBox="0 0 500 640" xmlns="http://www.w3.org/2000/svg" role="img" style="--accent:#eab308">
  <title>Tháp căn hộ đang thi công với cần cẩu tháp</title>
  <desc>Toà tháp căn hộ nhiều tầng với cần cẩu tháp bên cạnh đang cẩu một tấm bê tông lên giữa toà nhà. Dùng minh hoạ ngành bất động sản dân dụng. Số tầng đã đổ bê tông là tiến độ thật, cần cẩu dừng là dòng tiền dự án dừng.</desc>
  <g class="scene">
    <g class="ground">
      <rect x="0" y="550" width="500" height="90" fill="var(--ilus-7, #cbd5e1)"/>
      <rect x="0" y="550" width="500" height="5" fill="var(--ilus-6, #94a3b8)"/>
    </g>

    <g class="crane">
      <g class="mast" stroke="var(--ilus-1, #0f172a)" stroke-width="2.2">
        <line x1="95" y1="550" x2="95" y2="62"/>
        <line x1="113" y1="550" x2="113" y2="62"/>
        <line x1="95" y1="518" x2="113" y2="486"/>
        <line x1="113" y1="518" x2="95" y2="486"/>
        <line x1="95" y1="454" x2="113" y2="422"/>
        <line x1="113" y1="454" x2="95" y2="422"/>
        <line x1="95" y1="390" x2="113" y2="358"/>
        <line x1="113" y1="390" x2="95" y2="358"/>
        <line x1="95" y1="326" x2="113" y2="294"/>
        <line x1="113" y1="326" x2="95" y2="294"/>
        <line x1="95" y1="262" x2="113" y2="230"/>
        <line x1="113" y1="262" x2="95" y2="230"/>
        <line x1="95" y1="198" x2="113" y2="166"/>
        <line x1="113" y1="198" x2="95" y2="166"/>
        <line x1="95" y1="134" x2="113" y2="102"/>
        <line x1="113" y1="134" x2="95" y2="102"/>
      </g>
      <rect x="86" y="44" width="34" height="20" fill="var(--ilus-3, #334155)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.4"/>
      <g class="jib" stroke="var(--ilus-1, #0f172a)" stroke-width="2">
        <line x1="120" y1="46" x2="360" y2="52"/>
        <line x1="120" y1="58" x2="360" y2="58"/>
        <line x1="150" y1="47" x2="150" y2="57"/>
        <line x1="190" y1="48" x2="190" y2="57"/>
        <line x1="230" y1="49" x2="230" y2="58"/>
        <line x1="270" y1="50" x2="270" y2="58"/>
        <line x1="310" y1="51" x2="310" y2="58"/>
      </g>
      <g class="counter-jib" stroke="var(--ilus-1, #0f172a)" stroke-width="2">
        <line x1="86" y1="48" x2="48" y2="52"/>
        <line x1="86" y1="58" x2="48" y2="56"/>
      </g>
      <rect x="40" y="52" width="16" height="20" fill="var(--ilus-4, #475569)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.2"/>
      <line x1="255" y1="55" x2="255" y2="205" stroke="var(--ilus-1, #0f172a)" stroke-width="1.4" stroke-dasharray="3 3"/>
      <rect x="228" y="205" width="54" height="20" fill="var(--ilus-6, #94a3b8)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.6"/>
    </g>

    <g class="tower">
      <rect x="150" y="90" width="140" height="460" fill="var(--ilus-6, #94a3b8)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.6"/>
      <rect x="220" y="90" width="70" height="460" fill="var(--ilus-5, #64748b)"/>
      <rect x="150" y="90" width="140" height="14" fill="var(--ilus-3, #334155)"/>
      <g class="windows" fill="var(--ilus-3, #334155)">
        <rect x="172" y="112" width="20" height="24"/><rect x="212" y="112" width="20" height="24"/><rect x="252" y="112" width="20" height="24"/>
        <rect x="172" y="182" width="20" height="24" fill="var(--accent)"/><rect x="212" y="182" width="20" height="24"/><rect x="252" y="182" width="20" height="24"/>
        <rect x="172" y="252" width="20" height="24"/><rect x="212" y="252" width="20" height="24" fill="var(--accent)"/><rect x="252" y="252" width="20" height="24"/>
        <rect x="172" y="322" width="20" height="24"/><rect x="212" y="322" width="20" height="24"/><rect x="252" y="322" width="20" height="24" fill="var(--accent)"/>
        <rect x="172" y="392" width="20" height="24" fill="var(--accent)"/><rect x="212" y="392" width="20" height="24"/><rect x="252" y="392" width="20" height="24"/>
        <rect x="172" y="462" width="20" height="24"/><rect x="212" y="462" width="20" height="24" fill="var(--accent)"/><rect x="252" y="462" width="20" height="24"/>
        <rect x="172" y="518" width="20" height="24"/><rect x="212" y="518" width="20" height="24"/><rect x="252" y="518" width="20" height="24"/>
      </g>
      <rect x="180" y="60" width="40" height="30" fill="var(--ilus-4, #475569)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.2"/>
      <line x1="200" y1="60" x2="200" y2="40" stroke="var(--ilus-1, #0f172a)" stroke-width="2"/>
    </g>

    <g class="entrance">
      <rect x="195" y="510" width="50" height="40" fill="var(--ilus-2, #1e293b)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.2"/>
    </g>
  </g>
</svg>
