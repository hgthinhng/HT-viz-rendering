<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" style="--accent:#2563eb">
  <title>Cán cân phán quyết đầu tư</title>
  <desc>Cán cân hai đĩa nghiêng về bên trái (đòn bẩy) so với bên phải (rào cản), hình học đòn bẩy nghiêng thật theo tỷ trọng bằng chứng. Dùng chung cho mọi ngành khi cần tổng kết khuyến nghị MUA/GIỮ/BÁN hoặc KHẢ THI/CHƯA KHẢ THI.</desc>
  <!--
    LƯU Ý DÙNG LẠI (khác các file khác trong thư viện): đây là hình DUY NHẤT
    có 1 tham số phụ thuộc dữ liệu thật, GÓC NGHIÊNG của đòn cân, vì độ
    nghiêng CHÍNH LÀ thông tin (chênh lệch trọng số 2 bên), không thể để cố
    định như các minh hoạ khác. Bản này dựng sẵn ở tilt=8° (trái nặng hơn).
    Muốn đổi tỷ lệ nghiêng cho báo cáo khác: tính lại lEnd/rEnd bằng
      rad = tilt_deg * PI/180
      lEnd = (cx - 220*cos(rad), cy + 220*sin(rad))
      rEnd = (cx + 220*cos(rad), cy - 220*sin(rad))
    với cx=400, cy=220 (điểm tựa), rồi thay lại 4 số trong <path class="beam">
    và toạ độ "end.x/end.y" dùng để đặt 2 đĩa cân (dishTop = end.y + 130).
  -->
  <g class="scene">
    <g class="ground">
      <rect x="0" y="430" width="800" height="70" fill="var(--ilus-7, #cbd5e1)"/>
      <rect x="0" y="430" width="800" height="5" fill="var(--ilus-6, #94a3b8)"/>
    </g>

    <g class="stand">
      <path d="M355,415 L445,415 L425,430 L375,430 Z" fill="var(--ilus-2, #1e293b)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.4"/>
      <rect x="385" y="226" width="30" height="189" fill="var(--ilus-3, #334155)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.4"/>
      <circle cx="400" cy="222" r="7" fill="var(--ilus-1, #0f172a)"/>
    </g>

    <g class="beam">
      <line x1="182.1" y1="250.6" x2="617.9" y2="189.4" stroke="var(--ilus-1, #0f172a)" stroke-width="4"/>
    </g>

    <g class="pan-left">
      <line x1="127.1" y1="380.6" x2="182.1" y2="252.6" stroke="var(--ilus-4, #475569)" stroke-width="1.2"/>
      <line x1="237.1" y1="380.6" x2="182.1" y2="252.6" stroke="var(--ilus-4, #475569)" stroke-width="1.2"/>
      <path d="M117.1,380.6 L247.1,380.6 L227.1,396.6 L137.1,396.6 Z" fill="var(--ilus-4, #475569)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.3"/>
      <path d="M112.1,378.6 L252.1,378.6 L243.1,350.6 L121.1,350.6 Z" fill="var(--accent)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.3"/>
      <path d="M127.1,350.6 L237.1,350.6 L228.1,322.6 L136.1,322.6 Z" fill="var(--accent)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.3" opacity="0.85"/>
    </g>

    <g class="pan-right">
      <line x1="562.9" y1="319.4" x2="617.9" y2="191.4" stroke="var(--ilus-4, #475569)" stroke-width="1.2"/>
      <line x1="672.9" y1="319.4" x2="617.9" y2="191.4" stroke="var(--ilus-4, #475569)" stroke-width="1.2"/>
      <path d="M552.9,319.4 L682.9,319.4 L662.9,335.4 L572.9,335.4 Z" fill="var(--ilus-4, #475569)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.3"/>
      <path d="M547.9,317.4 L687.9,317.4 L678.9,289.4 L556.9,289.4 Z" fill="var(--ilus-6, #94a3b8)" stroke="var(--ilus-1, #0f172a)" stroke-width="1.3"/>
    </g>
  </g>
</svg>
