<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" style="--accent:#4f46e5">
  <title>He be du phong nghiep vu bao hiem</title>
  <desc>Be chinh nhan ong dan phi bao hiem goc va dong von dau tu tu tren, xa day qua ong boi thuong xuong be chua, va tran sang be phu nho hon qua ong nhuong tai bao hiem. Muc nuoc moi be la muc du phong nghiep vu con lai. Dung minh hoa nganh bao hiem.</desc>
  <g class="scene">
    <g class="ground">
      <rect x="0" y="430" width="800" height="70" fill="#cbd5e1"/>
      <rect x="0" y="430" width="800" height="5" fill="#94a3b8"/>
    </g>

    <!-- VON DAU TU: coc tien nho rot xuong be chinh = thu nhap dau tu tren quy du phong -->
    <g class="investment-feed">
      <g stroke="#0f172a" stroke-width="1.2">
        <ellipse cx="470" cy="92" rx="18" ry="6" fill="#eab308"/>
        <ellipse cx="470" cy="84" rx="16" ry="6" fill="#facc15"/>
        <ellipse cx="470" cy="76" rx="14" ry="6" fill="#eab308"/>
      </g>
      <path d="M462,70 L462,58 L462,58" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
      <path d="M462,120 L400,150" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
      <path d="M462,120 L400,150" stroke="#1e293b" stroke-width="1.4"/>
      <path d="M410,146 L398,152 L406,158 Z" fill="#475569" stroke="#0f172a" stroke-width="1"/>
    </g>

    <!-- ONG PHI BAO HIEM GOC: van + mui ten chieu chay = phi bao hiem goc thu duoc -->
    <g class="premium-inlet">
      <path d="M120,60 L120,150" stroke="#475569" stroke-width="14" stroke-linecap="round"/>
      <path d="M120,60 L120,150" stroke="#1e293b" stroke-width="2"/>
      <path d="M120,150 L300,150" stroke="#475569" stroke-width="14" stroke-linecap="round"/>
      <path d="M120,150 L300,150" stroke="#1e293b" stroke-width="2"/>
      <circle cx="120" cy="100" r="11" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.6"/>
      <g stroke="#0f172a" stroke-width="1.6">
        <line x1="120" y1="90" x2="120" y2="110"/>
        <line x1="110" y1="100" x2="130" y2="100"/>
      </g>
      <path d="M284,150 L300,150 L284,158 Z" fill="#1e293b"/>
    </g>

    <!-- BE CHINH: chieu cao chat long = muc du phong nghiep vu hien co -->
    <g class="main-tank">
      <path d="M300,150 A60,14 0 0 1 420,150" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
      <rect x="300" y="150" width="120" height="220" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
      <rect x="360" y="150" width="60" height="220" fill="#cbd5e1"/>
      <path d="M304,228 Q330,220 360,228 T420,228" fill="none" stroke="#3730a3" stroke-width="1.6" opacity="0.7"/>
      <rect x="304" y="228" width="112" height="140" fill="var(--accent)" opacity="0.55"/>
      <path d="M300,370 A60,12 0 0 0 420,370" fill="#94a3b8" stroke="#0f172a" stroke-width="1.4"/>
      <rect x="286" y="380" width="148" height="18" fill="#475569" stroke="#0f172a" stroke-width="1.3"/>
      <rect x="300" y="398" width="16" height="32" fill="#334155" stroke="#0f172a" stroke-width="1.2"/>
      <rect x="404" y="398" width="16" height="32" fill="#334155" stroke="#0f172a" stroke-width="1.2"/>
    </g>

    <!-- ONG TRAN SANG BE TAI BAO HIEM: ty le nhuong tai -->
    <g class="reinsurance-overflow">
      <path d="M418,200 L560,255" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
      <path d="M418,200 L560,255" stroke="#1e293b" stroke-width="1.8"/>
      <path d="M548,251 L562,258 L552,266 Z" fill="#1e293b"/>
    </g>

    <!-- BE PHU (nha tai bao hiem): quy mo nho hon, muc chat long thap hon -->
    <g class="cede-tank">
      <path d="M560,255 A42,10 0 0 1 644,255" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.4"/>
      <rect x="560" y="255" width="84" height="130" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.4"/>
      <rect x="602" y="255" width="42" height="130" fill="#cbd5e1"/>
      <path d="M564,340 Q580,334 602,340 T644,340" fill="none" stroke="#3730a3" stroke-width="1.4" opacity="0.7"/>
      <rect x="564" y="340" width="76" height="45" fill="var(--accent)" opacity="0.5"/>
      <path d="M560,385 A42,9 0 0 0 644,385" fill="#94a3b8" stroke="#0f172a" stroke-width="1.3"/>
      <rect x="550" y="392" width="104" height="14" fill="#475569" stroke="#0f172a" stroke-width="1.2"/>
      <rect x="562" y="406" width="12" height="24" fill="#334155" stroke="#0f172a" stroke-width="1.1"/>
      <rect x="622" y="406" width="12" height="24" fill="#334155" stroke="#0f172a" stroke-width="1.1"/>
    </g>

    <!-- ONG CHI BOI THUONG: luu luong xa day = chi tra boi thuong -->
    <g class="claims-outlet">
      <path d="M360,398 L360,436" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
      <path d="M360,398 L360,436" stroke="#1e293b" stroke-width="1.8"/>
      <path d="M354,430 L366,430 L360,442 Z" fill="var(--accent)"/>
      <path d="M300,440 L420,440 L410,460 L310,460 Z" fill="#94a3b8" stroke="#0f172a" stroke-width="1.4"/>
      <g stroke="var(--accent)" stroke-width="1.4" opacity="0.75">
        <circle cx="330" cy="452" r="2.5"/>
        <circle cx="360" cy="455" r="2.5"/>
        <circle cx="390" cy="452" r="2.5"/>
      </g>
    </g>
  </g>
</svg>
