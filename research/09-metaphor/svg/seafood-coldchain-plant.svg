<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" style="--accent:#059669">
  <title>Nha may che bien thuy san dong lanh xuat khau</title>
  <desc>San tap ket nguyen lieu uop da ben trai, xuong che bien mo mat truoc, kho lanh co cua mo he lo hang dong da xep, va day container lanh gan may lam mat cho xuat hang. Dung minh hoa nganh thuy san che bien xuat khau.</desc>
  <g class="scene">
    <g class="ground">
      <rect x="0" y="430" width="800" height="70" fill="#cbd5e1"/>
      <rect x="0" y="430" width="800" height="5" fill="#94a3b8"/>
    </g>

    <!-- SAN NGUYEN LIEU: chieu cao chong ket = san luong nguyen lieu thu mua -->
    <g class="intake-yard" stroke="#0f172a" stroke-width="1.3">
      <rect x="25" y="396" width="110" height="34" fill="#e0f2fe"/>
      <rect x="25" y="360" width="100" height="34" fill="#e0f2fe"/>
      <rect x="25" y="328" width="80" height="30" fill="#e0f2fe"/>
      <path d="M30,401 Q45,395 60,401 T90,401 T120,401" fill="none" stroke="#60a5fa" stroke-width="1.6" opacity="0.7"/>
      <path d="M30,365 Q45,359 60,365 T90,365 T115,365" fill="none" stroke="#60a5fa" stroke-width="1.6" opacity="0.7"/>
      <g fill="#f8fafc" stroke="#93c5fd" stroke-width="0.9">
        <path d="M40,398 L46,392 L52,398 L46,404 Z"/>
        <path d="M70,398 L76,392 L82,398 L76,404 Z"/>
        <path d="M100,398 L106,392 L112,398 L106,404 Z"/>
        <path d="M40,362 L46,356 L52,362 L46,368 Z"/>
        <path d="M75,362 L81,356 L87,362 L81,368 Z"/>
        <path d="M45,331 L51,325 L57,331 L51,337 Z"/>
      </g>
    </g>

    <!-- XUONG CHE BIEN MO MAT TRUOC: day chuyen phi le -->
    <g class="processing-hall">
      <path d="M180,300 L340,258 L500,300 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
      <rect x="180" y="296" width="320" height="8" fill="var(--accent)"/>
      <rect x="194" y="304" width="292" height="120" fill="#f8fafc" opacity="0.5"/>
      <rect x="180" y="300" width="14" height="128" fill="#94a3b8" stroke="#0f172a" stroke-width="1.4"/>
      <rect x="486" y="300" width="14" height="128" fill="#64748b" stroke="#0f172a" stroke-width="1.4"/>
      <rect x="180" y="426" width="320" height="4" fill="#475569"/>

      <g class="fillet-line" stroke="#0f172a" stroke-width="1.4">
        <g class="station">
          <rect x="212" y="418" width="36" height="6" fill="#334155"/>
          <rect x="220" y="398" width="20" height="20" fill="var(--accent)"/>
          <line x1="230" y1="398" x2="242" y2="388" stroke-width="1.6"/>
        </g>
        <g class="station station-idle">
          <rect x="264" y="418" width="36" height="6" fill="#334155"/>
          <rect x="272" y="398" width="20" height="20" fill="#94a3b8"/>
          <line x1="282" y1="398" x2="294" y2="388" stroke-width="1.6" opacity="0.5"/>
        </g>
        <g class="station">
          <rect x="316" y="418" width="36" height="6" fill="#334155"/>
          <rect x="324" y="398" width="20" height="20" fill="var(--accent)"/>
          <line x1="334" y1="398" x2="346" y2="388" stroke-width="1.6"/>
        </g>
        <g class="station">
          <rect x="368" y="418" width="36" height="6" fill="#334155"/>
          <rect x="376" y="398" width="20" height="20" fill="var(--accent)"/>
          <line x1="386" y1="398" x2="398" y2="388" stroke-width="1.6"/>
        </g>
        <g class="station">
          <rect x="420" y="418" width="36" height="6" fill="#334155"/>
          <rect x="428" y="398" width="20" height="20" fill="var(--accent)"/>
          <line x1="438" y1="398" x2="450" y2="388" stroke-width="1.6"/>
        </g>
      </g>
    </g>

    <!-- KHO LANH: muc xep hang dong trong cua mo = ton kho thanh pham dong lanh -->
    <g class="cold-store">
      <rect x="530" y="238" width="130" height="192" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
      <rect x="536" y="244" width="118" height="180" fill="none" stroke="#94a3b8" stroke-width="4"/>
      <rect x="530" y="238" width="130" height="12" fill="#334155"/>
      <rect x="548" y="216" width="14" height="24" fill="#64748b" stroke="#0f172a" stroke-width="1.1"/>
      <rect x="598" y="216" width="14" height="24" fill="#64748b" stroke="#0f172a" stroke-width="1.1"/>
      <g fill="#f8fafc" stroke="#0f172a" stroke-width="1">
        <path d="M600,238 L607,224 L614,238 Z"/>
        <path d="M614,238 L621,226 L628,238 Z"/>
        <path d="M628,238 L634,227 L640,238 Z"/>
      </g>
      <rect x="566" y="292" width="60" height="128" fill="#1e293b" stroke="#0f172a" stroke-width="1.3"/>
      <g class="frozen-stock" stroke="#0f172a" stroke-width="1">
        <rect x="571" y="392" width="22" height="20" fill="#bae6fd"/>
        <rect x="596" y="392" width="22" height="20" fill="#bae6fd"/>
        <rect x="571" y="368" width="22" height="20" fill="#bae6fd"/>
        <rect x="596" y="368" width="22" height="20" fill="#bae6fd"/>
        <rect x="571" y="344" width="22" height="20" fill="#7dd3fc"/>
        <rect x="596" y="344" width="22" height="20" fill="#7dd3fc"/>
      </g>
    </g>

    <!-- CONTAINER LANH: mau nhan the hien co cau thi truong xuat khau -->
    <g class="reefers" stroke="#0f172a" stroke-width="1.3">
      <g class="reefer">
        <rect x="676" y="360" width="10" height="8" fill="#475569"/>
        <circle cx="681" cy="382" r="7" fill="#334155"/>
        <circle cx="746" cy="382" r="7" fill="#334155"/>
        <rect x="676" y="330" width="90" height="46" fill="#f1f5f9"/>
        <rect x="676" y="330" width="90" height="18" fill="#e2e8f0"/>
        <g stroke="#94a3b8" stroke-width="1">
          <line x1="694" y1="330" x2="694" y2="376"/>
          <line x1="712" y1="330" x2="712" y2="376"/>
          <line x1="730" y1="330" x2="730" y2="376"/>
          <line x1="748" y1="330" x2="748" y2="376"/>
        </g>
        <rect x="676" y="330" width="16" height="46" fill="#64748b"/>
        <g stroke="#334155" stroke-width="1.2">
          <line x1="680" y1="340" x2="688" y2="340"/>
          <line x1="680" y1="348" x2="688" y2="348"/>
        </g>
        <path d="M700,318 L700,330" stroke="#0f172a" stroke-width="1.4"/>
        <rect x="695" y="308" width="16" height="10" fill="var(--accent)" stroke="#0f172a" stroke-width="1"/>
      </g>
      <g class="reefer reefer-partial" opacity="0.92">
        <rect x="774" y="336" width="30" height="40" fill="#f1f5f9"/>
        <rect x="774" y="336" width="30" height="16" fill="#e2e8f0"/>
        <rect x="774" y="336" width="10" height="40" fill="#64748b"/>
        <path d="M786,324 L786,336" stroke="#0f172a" stroke-width="1.4"/>
        <rect x="781" y="314" width="12" height="10" fill="#eab308" stroke="#0f172a" stroke-width="1"/>
      </g>
    </g>
  </g>
</svg>
