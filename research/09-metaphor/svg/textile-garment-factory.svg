<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" style="--accent:#db2777">
  <title>Nha may may xuat khau</title>
  <desc>Kho cuon vai nguyen lieu ben trai, xuong may mo mat truoc voi day chuyen may nhieu tram, khu dong goi kien hang FOB va CMT, cua xuat hang co xe tai cho o hang doi. Dung minh hoa nganh det may, may mac xuat khau.</desc>
  <g class="scene">
    <g class="ground">
      <rect x="0" y="430" width="800" height="70" fill="#cbd5e1"/>
      <rect x="0" y="430" width="800" height="5" fill="#94a3b8"/>
    </g>

    <!-- KHO CUON VAI: chieu cao chong cuon = ton kho nguyen lieu -->
    <g class="fabric-stock">
      <rect x="24" y="422" width="112" height="8" fill="#94a3b8" stroke="#0f172a" stroke-width="1"/>
      <rect x="30" y="392" width="100" height="30" rx="15" ry="15" fill="#db2777" stroke="#0f172a" stroke-width="1.4"/>
      <g stroke="#9d174d" stroke-width="1.3" fill="none" opacity="0.85">
        <path d="M45,394 A13,13 0 0 1 45,420"/>
        <path d="M45,399.5 A7.5,7.5 0 0 1 45,414.5"/>
      </g>
      <path d="M32,422 L20,436 L34,428 Z" fill="#db2777" stroke="#0f172a" stroke-width="1" opacity="0.9"/>

      <rect x="30" y="358" width="100" height="30" rx="15" ry="15" fill="#f472b6" stroke="#0f172a" stroke-width="1.4"/>
      <g stroke="#be185d" stroke-width="1.2" fill="none" opacity="0.85">
        <path d="M45,360 A13,13 0 0 1 45,386"/>
        <path d="M45,365.5 A7.5,7.5 0 0 1 45,380.5"/>
      </g>

      <rect x="30" y="326" width="72" height="28" rx="14" ry="14" fill="#94a3b8" stroke="#0f172a" stroke-width="1.4"/>
      <g stroke="#475569" stroke-width="1.1" fill="none" opacity="0.85">
        <path d="M44,328 A12,12 0 0 1 44,352"/>
      </g>
    </g>

    <!-- XUONG MAY MO MAT TRUOC: khung nha xuong, ben trong la day chuyen -->
    <g class="shed">
      <path d="M215,300 L387,255 L560,300 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
      <rect x="215" y="296" width="345" height="8" fill="var(--accent)"/>
      <rect x="229" y="304" width="317" height="120" fill="#f8fafc" opacity="0.5"/>
      <rect x="215" y="300" width="14" height="128" fill="#94a3b8" stroke="#0f172a" stroke-width="1.4"/>
      <rect x="546" y="300" width="14" height="128" fill="#64748b" stroke="#0f172a" stroke-width="1.4"/>
      <rect x="215" y="426" width="345" height="4" fill="#475569"/>
    </g>

    <!-- DAY CHUYEN MAY: so tram "sang den" / "tat den" = cong suat su dung -->
    <g class="sewing-line" stroke="#0f172a" stroke-width="1.4">
      <g class="station">
        <rect x="245" y="415" width="34" height="6" fill="#334155"/>
        <rect x="252" y="392" width="20" height="23" fill="var(--accent)"/>
        <line x1="262" y1="392" x2="262" y2="382" stroke-width="1.6"/>
        <circle cx="262" cy="382" r="3" fill="#0f172a"/>
      </g>
      <g class="station">
        <rect x="290" y="415" width="34" height="6" fill="#334155"/>
        <rect x="297" y="392" width="20" height="23" fill="var(--accent)"/>
        <line x1="307" y1="392" x2="307" y2="382" stroke-width="1.6"/>
        <circle cx="307" cy="382" r="3" fill="#0f172a"/>
      </g>
      <g class="station station-idle">
        <rect x="335" y="415" width="34" height="6" fill="#334155"/>
        <rect x="342" y="392" width="20" height="23" fill="#94a3b8"/>
        <line x1="352" y1="392" x2="352" y2="382" stroke-width="1.6" opacity="0.5"/>
        <circle cx="352" cy="382" r="3" fill="#64748b"/>
      </g>
      <g class="station">
        <rect x="380" y="415" width="34" height="6" fill="#334155"/>
        <rect x="387" y="392" width="20" height="23" fill="var(--accent)"/>
        <line x1="397" y1="392" x2="397" y2="382" stroke-width="1.6"/>
        <circle cx="397" cy="382" r="3" fill="#0f172a"/>
      </g>
      <g class="station">
        <rect x="425" y="415" width="34" height="6" fill="#334155"/>
        <rect x="432" y="392" width="20" height="23" fill="var(--accent)"/>
        <line x1="442" y1="392" x2="442" y2="382" stroke-width="1.6"/>
        <circle cx="442" cy="382" r="3" fill="#0f172a"/>
      </g>
      <g class="station">
        <rect x="470" y="415" width="34" height="6" fill="#334155"/>
        <rect x="477" y="392" width="20" height="23" fill="var(--accent)"/>
        <line x1="487" y1="392" x2="487" y2="382" stroke-width="1.6"/>
        <circle cx="487" cy="382" r="3" fill="#0f172a"/>
      </g>
    </g>

    <!-- DONG GOI: mau kien hang = co cau doanh thu FOB (dam) so CMT (nhat/xam) -->
    <g class="packing" stroke="#0f172a" stroke-width="1.3">
      <rect x="566" y="424" width="120" height="6" fill="#94a3b8"/>
      <rect x="572" y="398" width="32" height="28" fill="var(--accent)"/>
      <rect x="572" y="392" width="10" height="5" fill="#fdf2f8"/>
      <rect x="608" y="398" width="32" height="28" fill="#94a3b8"/>
      <rect x="608" y="392" width="10" height="5" fill="#f1f5f9"/>
      <rect x="644" y="398" width="32" height="28" fill="var(--accent)"/>
      <rect x="644" y="392" width="10" height="5" fill="#fdf2f8"/>
      <rect x="590" y="370" width="32" height="28" fill="var(--accent)" opacity="0.9"/>
      <rect x="626" y="370" width="32" height="28" fill="#94a3b8"/>
    </g>

    <!-- CUA XUAT HANG: xe tai dang xep + hang doi net dut = don hang cho giao -->
    <g class="dock">
      <rect x="690" y="330" width="60" height="100" fill="#1e293b" stroke="#0f172a" stroke-width="1.4"/>
      <g stroke="#475569" stroke-width="1.6">
        <line x1="690" y1="346" x2="750" y2="346"/>
        <line x1="690" y1="366" x2="750" y2="366"/>
        <line x1="690" y1="386" x2="750" y2="386"/>
      </g>
      <rect x="695" y="380" width="24" height="30" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.3"/>
      <rect x="717" y="368" width="55" height="42" fill="var(--accent)" stroke="#0f172a" stroke-width="1.3"/>
      <circle cx="705" cy="412" r="8" fill="#1e293b" stroke="#0f172a" stroke-width="1.2"/>
      <circle cx="755" cy="412" r="8" fill="#1e293b" stroke="#0f172a" stroke-width="1.2"/>
      <g fill="none" stroke="#0f172a" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.65">
        <rect x="762" y="372" width="34" height="40"/>
        <rect x="780" y="378" width="26" height="34"/>
      </g>
    </g>
  </g>
</svg>
